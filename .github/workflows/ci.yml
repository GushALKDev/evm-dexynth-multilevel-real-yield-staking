name: CI

on:
  push:
  pull_request:

jobs:
  foundry:
    name: Build, format, tests and gas snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same version as the local toolchain used to produce the snapshots
          version: v1.7.1

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build

      - name: Check formatting
        run: forge fmt --check

      - name: Tests
        run: forge test

      - name: Testnet tooling tests
        run: FOUNDRY_PROFILE=testnet forge test

      - name: Gas benchmarks
        run: FOUNDRY_PROFILE=gas forge test

      - name: Gas snapshots unchanged
        run: git diff --exit-code snapshots/

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The parity step deploys the contracts to a local chain
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # One step, so the anvil node lives through the tests. It is started here with its output detached:
      # a background process that keeps the step's output open can keep the step from finishing.
      - name: Parity with the contracts
        run: |
          anvil --silent --chain-id 31337 > /dev/null 2>&1 &
          for _ in $(seq 1 50); do cast chain-id >/dev/null 2>&1 && break; sleep 0.2; done
          ./scripts/local-chain.sh
          LOCAL_RPC=http://127.0.0.1:8545 npx vitest run scripts

      - name: Build
        run: npm run build

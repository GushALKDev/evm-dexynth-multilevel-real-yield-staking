name: CI

on:
  push:
  pull_request:

jobs:
  foundry:
    name: Build, format, tests and gas snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same version as the local toolchain used to produce the snapshots
          version: v1.7.1

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build

      - name: Check formatting
        run: forge fmt --check

      - name: Tests
        run: forge test

      - name: Gas benchmarks
        run: FOUNDRY_PROFILE=gas forge test

      - name: Gas snapshots unchanged
        run: git diff --exit-code snapshots/

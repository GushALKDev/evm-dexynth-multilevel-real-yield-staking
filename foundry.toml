[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
]
via_ir = true
solc = "0.8.28"
# The invariant suites append their per-run effective call counts to cache/invariant-stats-*.txt. The testnet
# scripts write and read the deployment files of the demo app
fs_permissions = [
    { access = "read-write", path = "./cache" },
    { access = "read-write", path = "./app/src/config/deployments" },
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
multiline_func_header = "attributes_first"
# Frozen copy of the original v1 contract, kept byte for byte apart from its imports
ignore = ["bench/**"]

# Gas benchmarks, kept apart from the correctness suite: FOUNDRY_PROFILE=gas forge test
[profile.gas]
test = "gas"
# Every top-level call runs as its own transaction, so storage warmed by the setup is cold again and the measured
# gas matches a transaction receipt (including the 21,000 intrinsic gas and calldata)
isolate = true

# Testnet tooling (script/testnet): its own suite, so the protocol's test figures stay unchanged
# FOUNDRY_PROFILE=testnet forge test
[profile.testnet]
test = "script/testnet/test"

[invariant]
# Defaults; each campaign in test/invariant/Invariant.t.sol sets its own runs and depth with inline config and
# justifies them there
runs = 256
depth = 64
# The handler asserts every expected revert with vm.expectRevert, so any other revert is a failure
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
